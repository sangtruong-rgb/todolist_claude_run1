<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Thêm việc và đánh dấu xong</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/*
DESIGN BRIEF (agreed with the user, applies to every ticket of the todo app)
- Vibe: "Sổ tay ấm áp" — cream paper, serif headings, terracotta. Like a hand-written notebook.
- Theme: light and dark, following the system setting; no switch.
- Colours and type: the palette of the chosen vibe. Headings Georgia (serif), body system sans.
  Light: paper #FBF7EF, paper-2 #EFE6D6, ink #2E2A24, muted #7A6F60, terracotta #C2552D.
  #C2552D is 4.24:1 on paper, under the 4.5 text minimum, so text in the accent uses #A9461F;
  #C2552D stays for the margin rule, the tick and filled buttons (white on it is 4.53:1).
- Motion: only in answer to an action (the tick when a task is marked done, the undo toast
  sliding in); none with prefers-reduced-motion.
- Corners 4px, roomy rows.

PLAN
- Memorable thing: the page is a sheet of ruled notebook paper — each task sits on its own
  ruled line, and a thin terracotta margin rule runs down the left of the sheet, like a
  school exercise book. Everything else stays quiet.
- Layout: desktop — the lists as an index on the left (T5), the sheet centred in the space
  that is left, at most 840px wide. Mobile — the sheet fills the width, the lists open from a button.
- Type scale: list title Georgia 34/40, body 16/24 sans, meta 13/20 sans.
- Left aligned throughout. No cards, no shadows except the toast and dialog.
*/
:root {
  --paper: #FBF7EF;
  --paper-2: #EFE6D6;
  --ink: #2E2A24;
  --muted: #7A6F60;
  --muted-2: #665C4F; /* muted text on paper-2 */
  --accent: #C2552D;
  --accent-text: #A9461F;
  --on-accent: #FFFFFF;
  --rule: #E3D7C3;
  --margin: rgba(194, 85, 45, 0.45);
  --done: #776C5D;
  --shadow: 0 8px 24px rgba(46, 42, 36, 0.18);
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #221F1A;
    --paper-2: #2E2A23;
    --ink: #F1E9DA;
    --muted: #B3A793;
    --muted-2: #B3A793;
    --accent: #C2552D;
    --accent-text: #E58A63;
    --on-accent: #FFFFFF;
    --rule: #3A352D;
    --margin: rgba(229, 138, 99, 0.45);
    --done: #9A8F7E;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --paper: #221F1A;
    --paper-2: #2E2A23;
    --ink: #F1E9DA;
    --muted: #B3A793;
    --muted-2: #B3A793;
    --accent: #C2552D;
    --accent-text: #E58A63;
    --on-accent: #FFFFFF;
    --rule: #3A352D;
    --margin: rgba(229, 138, 99, 0.45);
    --done: #9A8F7E;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 16px/24px var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* prototype bar — not part of the product */
.pbar { background: #1F2937; color: #F9FAFB; font: 13px/18px var(--sans); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.pbar b { font-weight: 600; margin-right: 4px; }
.pbar button { background: #374151; color: #F9FAFB; border: 0; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
.pbar button[aria-current="true"] { background: #F9FAFB; color: #111827; }
.pbar .hint { color: #D1D5DB; width: 100%; }

/* app frame */
.app { display: grid; grid-template-columns: 1fr; min-height: calc(100vh - 34px); }
.app.has-lists { grid-template-columns: 248px 1fr; }
.index { border-right: 1px solid var(--rule); padding: 40px 16px 24px 28px; background: var(--paper); }
.index h2 { font: 600 13px/20px var(--sans); color: var(--muted); margin: 0 0 12px 8px; }
.index ul { list-style: none; margin: 0; padding: 0; }
.index li + li { margin-top: 2px; }
.lst { width: 100%; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; background: none; border: 0; text-align: left; padding: 8px; border-radius: 4px; cursor: pointer; }
.lst:hover { background: var(--paper-2); }
.lst[aria-current="true"] { background: var(--paper-2); font-weight: 600; }
.lst[aria-current="true"] .n { color: var(--muted-2); }
.lst .name { overflow-wrap: anywhere; }
.lst .n { color: var(--muted); font-size: 13px; }
.newlist { margin-top: 12px; }
.linkbtn { background: none; border: 0; padding: 8px; color: var(--accent-text); cursor: pointer; border-radius: 4px; }
.linkbtn:hover { text-decoration: underline; }
.newlist form { display: grid; gap: 8px; padding: 8px; }
.newlist .row { display: flex; gap: 8px; }

.sheet { position: relative; padding: 40px 24px 96px 72px; max-width: 840px; width: 100%; margin-inline: auto; }
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 52px; width: 1px; background: var(--margin); }
.mhead { display: none; }
.titlebar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
h1 { font: 400 34px/40px var(--serif); margin: 0; overflow-wrap: anywhere; letter-spacing: -0.01em; }
.listacts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-left: auto; }
.hint-only { color: var(--muted); font-size: 13px; line-height: 20px; padding: 0 8px; }
.meta { color: var(--muted); font-size: 13px; line-height: 20px; margin: 6px 0 0; }

.filters { display: flex; gap: 20px; margin-top: 20px; border-bottom: 1px solid var(--rule); }
.filters button { background: none; border: 0; padding: 6px 0 8px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.filters button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

.banner { margin: 16px 0 0; padding: 10px 14px; background: var(--paper-2); border-left: 3px solid var(--accent); color: var(--ink); font-size: 14px; line-height: 20px; border-radius: 0 4px 4px 0; }

.add { margin-top: 20px; }
.add form, .editform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { flex: 1 1 220px; min-width: 0; height: 44px; padding: 0 12px; background: var(--paper); border: 1px solid var(--rule); border-bottom: 1px solid var(--muted); border-radius: 4px; }
.field::placeholder { color: var(--muted); opacity: 1; }
.field[aria-invalid="true"] { border-color: var(--accent); }
.date, .prio { height: 44px; padding: 0 10px; background: var(--paper); border: 1px solid var(--rule); border-bottom: 1px solid var(--muted); border-radius: 4px; }
.date { flex: 0 0 160px; }
.prio { flex: 0 0 140px; }
.btn { height: 44px; padding: 0 18px; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); cursor: pointer; font-weight: 600; }
.btn.quiet { background: none; color: var(--ink); border-color: var(--rule); font-weight: 400; }
.btn.small, .btn.quiet.small { height: 36px; padding: 0 12px; }
.err { color: var(--accent-text); font-size: 13px; line-height: 20px; margin: 6px 0 0; width: 100%; }
.fl { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }

.tasks { list-style: none; margin: 12px 0 0; padding: 0; }
.task { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.task.editing { display: block; padding: 12px 0; }
.check { position: relative; flex: 0 0 22px; width: 22px; height: 22px; margin: 0; }
.check input { appearance: none; -webkit-appearance: none; margin: 0; width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper); cursor: pointer; display: block; }
.check input:checked { background: var(--accent); border-color: var(--accent); }
.check svg { position: absolute; inset: 0; pointer-events: none; }
.check path { stroke: var(--on-accent); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; }
.check input:checked + svg path { stroke-dashoffset: 0; }
.task.justdone .check path { animation: tick 200ms ease-out; }
.task.justdone .title { animation: fadeDone 200ms ease-out; }
@keyframes tick { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
@keyframes fadeDone { from { color: var(--ink); } to { color: var(--done); } }
.title { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.task.done .title { text-decoration: line-through; text-decoration-color: var(--done); color: var(--done); }
.tmeta { display: flex; gap: 10px; align-items: baseline; font-size: 13px; line-height: 20px; color: var(--muted); white-space: nowrap; }
.due.over { color: var(--accent-text); font-weight: 600; }
.pr-high { color: var(--accent-text); font-weight: 600; }
.task.done .tmeta, .task.done .pr-high, .task.done .due.over { color: var(--done); font-weight: 400; }
.acts { display: flex; gap: 2px; }
.ghost { background: none; border: 0; color: var(--muted); padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.ghost:hover { background: var(--paper-2); color: var(--ink); }
.ghost:disabled { cursor: not-allowed; opacity: 0.55; }
.ghost:disabled:hover { background: none; color: var(--muted); }

.empty { padding: 28px 0; border-bottom: 1px solid var(--rule); }
.empty p { margin: 0; }
.empty .big { font: italic 20px/28px var(--serif); }
.empty .small { color: var(--muted); font-size: 14px; margin-top: 4px; }
.foot { display: flex; justify-content: flex-end; margin-top: 12px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 10px 10px 10px 18px; background: var(--ink); color: var(--paper); border-radius: 4px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); width: max-content; animation: toastIn 200ms ease-out; z-index: 5; }
.toast span { overflow-wrap: anywhere; }
.toast button { background: none; border: 0; color: var(--paper); font-weight: 700; text-decoration: underline; padding: 6px 8px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
@keyframes toastIn { from { transform: translate(-50%, 16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

.scrim { position: fixed; inset: 0; background: rgba(20, 18, 15, 0.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dialog { background: var(--paper); color: var(--ink); border-radius: 4px; box-shadow: var(--shadow); padding: 24px; width: 100%; max-width: 420px; }
.dialog h2 { font: 400 24px/30px var(--serif); margin: 0 0 8px; }
.dialog p { margin: 0 0 20px; }
.dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
.drawer { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); background: var(--paper); box-shadow: var(--shadow); padding: 24px 16px; z-index: 11; overflow-y: auto; }
.drawer .close { position: absolute; top: 14px; right: 12px; }

@media (min-width: 721px) { .narrow-only { display: none !important; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (max-width: 720px) {
  .app.has-lists { grid-template-columns: 1fr; }
  .app.has-lists > .index:not(.drawer) { display: none; }
  .sheet { padding: 20px 16px 96px 40px; }
  .sheet::before { left: 24px; }
  .mhead { display: flex; margin: -4px 0 16px; }
  h1 { font-size: 28px; line-height: 34px; }
  .listacts { margin-left: 0; width: 100%; }
  .add form .field { flex-basis: 100%; }
  .date, .prio { flex: 1 1 120px; }
  .add form .btn { flex: 1 1 100%; }
  .task:not(.editing) { display: grid; grid-template-columns: 22px 1fr auto; grid-template-areas: "c t t" ". m a"; gap: 2px 12px; align-items: center; padding: 10px 0 6px; }
  .task .check { grid-area: c; align-self: start; margin-top: 1px; }
  .task .title { grid-area: t; }
  .task .tmeta { grid-area: m; }
  .task .acts { grid-area: a; margin-right: -8px; }
  .editform .btn { flex: 1 1 auto; }
}
</style>
<div id="app"></div>
<script>
window.__CFG = {"level":1,"change":1,"demo":false,"bar":"","screens":[{"id":"t1-empty","title":"Lần đầu mở app","preset":"empty"},{"id":"t1-list","title":"Có việc","preset":"list"},{"id":"t1-invalid","title":"Thêm khi ô trống","preset":"invalid"},{"id":"t1-storage","title":"Không lưu được","preset":"storage"}]};
/* Shared source of every ticket's prototype and of the demo. CFG is set by build.mjs:
   { level: 1..5 (features present), change: level whose parts are marked data-change (0 = none),
     screens: [{ id, title, preset }], demo: bool, bar: string } */
(function () {
  const CFG = window.__CFG;
  const L = CFG.level;
  const dc = (l) => (CFG.change === l ? ' data-change' : '');
  const MAX_TASK = 200;
  const MAX_LIST = 40;
  const UNDO_MS = 5000;
  const PRIO = { high: 'Cao', med: 'Trung bình', low: 'Thấp' };
  const PRANK = { high: 0, med: 1, low: 2 };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const day = (off) => { const d = today(); d.setDate(d.getDate() + off); return isoOf(d); };
  const parse = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
  function dueLabel(iso, done) {
    const d = parse(iso);
    const diff = Math.round((d - today()) / 86400000);
    const base = d.getFullYear() === today().getFullYear() ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}` : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    if (diff < 0 && !done) return { text: `Quá hạn ${base}`, over: true };
    if (diff === 0) return { text: 'Hôm nay', over: false };
    if (diff === 1) return { text: 'Ngày mai', over: false };
    return { text: base, over: false };
  }

  let seq = 100;
  const T = (listId, title, o = {}) => ({ id: 't' + seq, seq: seq++, listId, title, done: !!o.done, due: L >= 4 ? o.due ?? null : null, prio: L >= 4 ? o.prio || 'med' : 'med' });
  const sampleTasks = () => [
    T('l1', 'Gửi báo giá cho anh Minh', { due: day(0), prio: 'high' }),
    T('l1', 'Nộp tiền điện tháng 11', { due: day(-2) }),
    T('l1', 'Đặt lịch khám răng cho bé An', { due: day(2) }),
    T('l1', 'Mua quà sinh nhật mẹ: khăn lụa hoặc túi xách nhỏ, nhớ hỏi chị Hà xem mẹ thích màu gì', { due: day(9), prio: 'low' }),
    T('l1', 'Đọc xong chương 4 cuốn Nhà giả kim', { prio: 'low' }),
    T('l1', 'Gọi điện hỏi thăm bác Tư', { done: true, due: day(-1) }),
    T('l1', 'Dọn tủ quần áo', { done: true }),
  ];
  const extraLists = () => ({
    lists: [{ id: 'l2', name: 'Công việc' }, { id: 'l3', name: 'Mua sắm' }],
    tasks: [
      T('l2', 'Chuẩn bị slide họp quý IV', { due: day(1), prio: 'high' }),
      T('l2', 'Trả lời email của phòng kế toán', { due: day(0) }),
      T('l2', 'Cập nhật hồ sơ dự án Đà Nẵng', { done: true }),
      T('l3', 'Sữa tươi không đường'), T('l3', 'Trứng gà'), T('l3', 'Rau cải ngọt'), T('l3', 'Nước rửa chén'), T('l3', 'Giấy vệ sinh'),
    ],
  });

  const fresh = () => ({ lists: [{ id: 'l1', name: 'Việc của tôi' }], current: 'l1', tasks: [], filter: 'all', addError: '', editing: null, editError: '', toast: null, storageBlocked: false, newList: null, renaming: null, confirmDelete: null, menuOpen: false, justDone: null, focus: null, focusSel: null, leaving: null, addDraft: null, addText: '', addErrField: null });
  const withSample = (s) => { s.tasks = sampleTasks(); if (L >= 5) { const x = extraLists(); s.lists.push(...x.lists); s.tasks.push(...x.tasks); } return s; };

  const PRESETS = {
    empty: () => fresh(),
    list: () => withSample(fresh()),
    invalid: () => Object.assign(withSample(fresh()), { addError: 'Hãy nhập tên việc.' }),
    storage: () => Object.assign(withSample(fresh()), { storageBlocked: true }),
    edit: () => { const s = withSample(fresh()); s.editing = { id: s.tasks[2].id, title: s.tasks[2].title, due: s.tasks[2].due || '', prio: s.tasks[2].prio }; return s; },
    editInvalid: () => { const s = withSample(fresh()); s.editing = { id: s.tasks[2].id, title: '', due: s.tasks[2].due || '', prio: s.tasks[2].prio }; s.editError = 'Hãy nhập tên việc.'; return s; },
    undo: () => { const s = withSample(fresh()); const i = 1; const [t] = s.tasks.splice(i, 1); s.toast = { text: `Đã xoá “${t.title}”`, restore: [{ t, i }], sticky: true }; return s; },
    active: () => Object.assign(withSample(fresh()), { filter: 'active' }),
    done: () => Object.assign(withSample(fresh()), { filter: 'done' }),
    activeEmpty: () => { const s = withSample(fresh()); s.tasks.forEach((t) => (t.done = true)); s.filter = 'active'; return s; },
    doneEmpty: () => { const s = withSample(fresh()); s.tasks.forEach((t) => (t.done = false)); s.filter = 'done'; return s; },
    cleared: () => { const s = withSample(fresh()); const gone = s.tasks.map((t, i) => ({ t, i })).filter((x) => x.t.done && x.t.listId === 'l1'); s.tasks = s.tasks.filter((t) => !(t.done && t.listId === 'l1')); s.toast = { text: `Đã xoá ${gone.length} việc đã xong`, restore: gone, sticky: true, clear: true }; return s; },
    newList: () => Object.assign(withSample(fresh()), { newList: { value: '', error: '' } }),
    newListInvalid: () => Object.assign(withSample(fresh()), { newList: { value: 'mua sắm', error: 'Đã có danh sách tên này.' } }),
    otherList: () => Object.assign(withSample(fresh()), { current: 'l3' }),
    rename: () => Object.assign(withSample(fresh()), { current: 'l3', renaming: { value: 'Mua sắm', error: '' } }),
    confirmDelete: () => Object.assign(withSample(fresh()), { current: 'l3', confirmDelete: 'l3' }),
    onlyList: () => fresh(),
    menu: () => Object.assign(withSample(fresh()), { menuOpen: true }),
  };

  let S = fresh();
  let current = null;
  let toastTimer = null;
  const root = document.getElementById('app');

  const listOf = (id) => S.lists.find((l) => l.id === id);
  const inList = () => S.tasks.filter((t) => t.listId === S.current);
  const undoneCount = (id) => S.tasks.filter((t) => t.listId === id && !t.done).length;
  function ordered(tasks) {
    const cmp = (a, b) => {
      const ad = a.id === S.leaving ? !a.done : a.done;
      const bd = b.id === S.leaving ? !b.done : b.done;
      if (ad !== bd) return ad ? 1 : -1;
      if (L >= 4) {
        if (a.due !== b.due) { if (!a.due) return 1; if (!b.due) return -1; return a.due < b.due ? -1 : 1; }
        if (a.prio !== b.prio) return PRANK[a.prio] - PRANK[b.prio];
      }
      return a.seq - b.seq;
    };
    return [...tasks].sort(cmp);
  }

  function armToast() {
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { S.toast = null; render(); }, UNDO_MS);
  }
  function setToast(text, restore) {
    S.toast = { text, restore };
    armToast();
  }
  function dropToastOf(listId) { if (S.toast && S.toast.restore.some((x) => x.t.listId === listId)) { clearTimeout(toastTimer); S.toast = null; } }
  const visIds = (sel) => [...root.querySelectorAll(sel)].filter((el) => el.getClientRects().length > 0).map((el) => el.dataset.id);
  const neighbour = (sel, id) => { const ids = visIds(sel); const i = ids.indexOf(id); return ids[i + 1] || ids[i - 1] || null; };

  function taskRow(t) {
    if (S.editing && S.editing.id === t.id) return editRow(t);
    const dl = L >= 4 && t.due ? dueLabel(t.due, t.done) : null;
    const meta = L >= 4 ? `<span class="tmeta"${dc(4)}>${dl ? `<span class="due${dl.over ? ' over' : ''}">${dl.text}</span>` : ''}${t.prio === 'high' ? '<span class="pr-high">Cao</span>' : t.prio === 'low' ? '<span class="pr-low">Thấp</span>' : ''}</span>` : '';
    const acts = L >= 2 ? `<span class="acts"${dc(2)}><button class="ghost" data-act="edit" data-id="${t.id}" aria-label="Sửa: ${esc(t.title)}">Sửa</button><button class="ghost" data-act="del" data-id="${t.id}" aria-label="Xoá: ${esc(t.title)}">Xoá</button></span>` : '';
    return `<li class="task${t.done ? ' done' : ''}${S.justDone === t.id ? ' justdone' : ''}">
      <span class="check"><input type="checkbox" data-act="toggle" data-id="${t.id}" ${t.done ? 'checked' : ''} aria-label="Đã xong: ${esc(t.title)}"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6 11.5l3.2 3.2L16 8"/></svg></span>
      <span class="title">${esc(t.title)}</span>${meta}${acts}</li>`;
  }
  function editRow(t) {
    const e = S.editing;
    const extra = L >= 4 ? `
        <label class="fl"${dc(4)}>Hạn chót<input class="date" type="date" name="due" value="${e.due}" data-focus="editdue" ${S.editError && S.editErrField === 'due' ? 'aria-invalid="true" aria-describedby="edit-err"' : ''}></label>
        ${e.due ? `<button type="button" class="btn quiet small" data-act="nodue" style="align-self:flex-end"${dc(4)}>Bỏ hạn</button>` : ''}
        <label class="fl"${dc(4)}>Ưu tiên<select class="prio" name="prio">${Object.entries(PRIO).map(([k, v]) => `<option value="${k}" ${e.prio === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>` : '';
    return `<li class="task editing"${dc(2)}><form class="editform" data-form="edit">
      <label class="fl" style="flex:1 1 260px">Tên việc<input class="field" name="title" maxlength="${MAX_TASK}" value="${esc(e.title)}" ${S.editError && S.editErrField !== 'due' ? 'aria-invalid="true" aria-describedby="edit-err"' : ''} data-focus="edit"></label>
      ${extra}
      <span style="display:flex;gap:8px;align-self:flex-end"><button class="btn small" type="submit">Lưu</button><button class="btn quiet small" type="button" data-act="cancel">Huỷ</button></span>
      ${S.editError ? `<p class="err" id="edit-err" role="alert">${S.editError}</p>` : ''}
    </form></li>`;
  }

  function indexNav(px = '') {
    return `<h2>Danh sách</h2><ul>${S.lists.map((l) => `<li><button class="lst" data-act="open" data-id="${l.id}" aria-current="${l.id === S.current}"><span class="name">${esc(l.name)}</span><span class="n" aria-label="${undoneCount(l.id)} việc chưa xong">${undoneCount(l.id)}</span></button></li>`).join('')}</ul>
      <div class="newlist">${S.newList ? `<form data-form="newlist"><label class="fl">Tên danh sách<input class="field" name="name" maxlength="${MAX_LIST}" value="${esc(S.newList.value)}" ${S.newList.error ? `aria-invalid="true" aria-describedby="${px}nl-err"` : ''} data-focus="newlist"></label>${S.newList.error ? `<p class="err" id="${px}nl-err" role="alert">${S.newList.error}</p>` : ''}<span class="row"><button class="btn small" type="submit">Tạo</button><button class="btn quiet small" type="button" data-act="nlcancel">Huỷ</button></span></form>` : '<button class="linkbtn" data-act="newlist">+ Danh sách mới</button>'}</div>`;
  }

  function render() {
    const list = listOf(S.current);
    const mine = inList();
    const shown = ordered(mine.filter((t) => (L < 3 || S.filter === 'all' || t.id === S.leaving) ? true : S.filter === 'active' ? !t.done : t.done));
    const doneN = mine.filter((t) => t.done).length;
    let empty = '';
    if (shown.length === 0) {
      if (mine.length === 0 || L < 3 || S.filter === 'all') empty = `<div class="empty"><p class="big">Trang này còn trống.</p><p class="small">Viết việc đầu tiên vào ô phía trên rồi nhấn Thêm.</p></div>`;
      else if (S.filter === 'active') empty = `<div class="empty"${dc(3)}><p class="big">Không còn việc nào chưa xong.</p></div>`;
      else empty = `<div class="empty"${dc(3)}><p class="big">Chưa có việc nào xong.</p></div>`;
    }
    const only = S.lists.length === 1;
    const title = S.renaming
      ? `<form class="editform" data-form="rename"${dc(5)} style="width:100%"><label class="fl" style="flex:1 1 240px">Tên danh sách<input class="field" name="name" maxlength="${MAX_LIST}" value="${esc(S.renaming.value)}" ${S.renaming.error ? 'aria-invalid="true" aria-describedby="rn-err"' : ''} data-focus="rename"></label><span style="display:flex;gap:8px;align-self:flex-end"><button class="btn small" type="submit">Lưu</button><button class="btn quiet small" type="button" data-act="rncancel">Huỷ</button></span>${S.renaming.error ? `<p class="err" id="rn-err" role="alert">${S.renaming.error}</p>` : ''}</form>`
      : `<h1>${esc(list.name)}</h1>${L >= 5 ? `<span class="listacts"${dc(5)}><button class="ghost" data-act="rename">Đổi tên</button><button class="ghost" data-act="dellist" ${only ? 'disabled aria-describedby="only-hint"' : ''}>Xoá danh sách</button>${only ? '<span class="hint-only" id="only-hint">Cần giữ ít nhất một danh sách</span>' : ''}</span>` : ''}`;
    const addExtra = L >= 4 ? `<label class="sr-only" for="add-due">Hạn chót</label><input id="add-due" class="date" type="date" name="due" title="Hạn chót" value="${S.addDraft ? S.addDraft.due : ''}" ${S.addError && S.addErrField === 'due' ? 'aria-invalid="true" aria-describedby="add-err"' : ''} data-focus="adddue"${dc(4)}><label class="sr-only" for="add-prio">Ưu tiên</label><select id="add-prio" class="prio" name="prio" title="Ưu tiên"${dc(4)}>${Object.entries(PRIO).map(([k, v]) => `<option value="${k}" ${k === (S.addDraft ? S.addDraft.prio : 'med') ? 'selected' : ''}>Ưu tiên: ${v}</option>`).join('')}</select>` : '';
    const ln = listOf(S.confirmDelete || '') || {};
    const dialog = S.confirmDelete ? `<div class="scrim"${dc(5)}><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dl-t" aria-describedby="dl-d"><h2 id="dl-t">Xoá danh sách?</h2><p id="dl-d">Xoá danh sách ${esc(ln.name)} và ${S.tasks.filter((t) => t.listId === ln.id).length} việc trong đó?</p><div class="row"><button class="btn quiet" data-act="dlcancel" data-focus="dlcancel">Huỷ</button><button class="btn" data-act="dlok">Xoá</button></div></div></div>` : '';
    const drawer = L >= 5 && S.menuOpen ? `<div class="scrim narrow-only" data-act="menuclose"${dc(5)} style="place-items:stretch"></div><nav class="drawer index narrow-only" role="dialog" aria-modal="true" aria-label="Danh sách"${dc(5)}><button class="ghost close" data-act="menuclose" data-focus="menu">Đóng</button>${indexNav('m-')}</nav>` : '';
    const bar = CFG.demo
      ? `<div class="pbar" role="region" aria-label="Thanh demo"><b>Demo cả luồng, dữ liệu mẫu</b><button data-p="reset">Bắt đầu lại (trống)</button><button data-p="sample">Nạp dữ liệu mẫu</button><span class="hint">${CFG.bar}</span></div>`
      : `<div class="pbar" role="region" aria-label="Thanh prototype"><b>Prototype, dữ liệu mẫu</b>${CFG.screens.map((s) => `<button data-p="go" data-id="${s.id}" aria-current="${s.id === current}">${esc(s.title)}</button>`).join('')}</div>`;

    root.innerHTML = `${bar}
    <div class="app${L >= 5 ? ' has-lists' : ''}"${CFG.demo ? '' : ` data-screen="${current}"`}${CFG.change === 1 ? ' data-change' : ''}>
      ${L >= 5 ? `<nav class="index" aria-label="Danh sách"${dc(5)}>${indexNav()}</nav>` : ''}
      <main class="sheet">
        ${L >= 5 ? `<div class="mhead"${dc(5)}><button class="btn quiet small" data-act="menu" aria-haspopup="dialog">☰ Danh sách</button></div>` : ''}
        <div class="titlebar">${title}</div>
        ${L >= 3 ? `<p class="meta"${dc(3)}>${undoneCount(S.current)} việc chưa xong</p>` : ''}
        ${S.storageBlocked ? '<p class="banner" role="status">Trình duyệt đang chặn lưu dữ liệu. Việc bạn thêm sẽ mất khi đóng trang.</p>' : ''}
        <div class="add"><form data-form="add" novalidate><label class="sr-only" for="add-title">Việc mới</label><input id="add-title" class="field" name="title" maxlength="${MAX_TASK}" placeholder="Thêm việc mới…" autocomplete="off" value="${esc(S.addText)}" ${S.addError && S.addErrField !== 'due' ? 'aria-invalid="true" aria-describedby="add-err"' : ''} data-focus="add">${addExtra}<button class="btn" type="submit">Thêm</button>${S.addError ? `<p class="err" id="add-err" role="alert">${S.addError}</p>` : ''}</form></div>
        ${L >= 3 ? `<div class="filters" role="group" aria-label="Lọc việc"${dc(3)}>${[['all', 'Tất cả'], ['active', 'Chưa xong'], ['done', 'Đã xong']].map(([k, v]) => `<button data-act="filter" data-id="${k}" aria-pressed="${S.filter === k}">${v}</button>`).join('')}</div>` : ''}
        ${shown.length ? `<ul class="tasks"${dc(4)}>${shown.map(taskRow).join('')}</ul>` : empty}
        ${L >= 3 && doneN > 0 ? `<div class="foot"${dc(3)}><button class="ghost" data-act="clear">Xoá việc đã xong (${doneN})</button></div>` : ''}
      </main>
      ${S.toast ? `<div class="toast" role="status"${S.toast.clear ? dc(3) : dc(2)}><span>${esc(S.toast.text)}</span><button data-act="undo">Hoàn tác</button></div>` : ''}
      ${dialog}${drawer}
    </div>`;
    const toast = root.querySelector('.toast');
    if (toast) {
      toast.addEventListener('mouseenter', () => clearTimeout(toastTimer));
      toast.addEventListener('focusin', () => clearTimeout(toastTimer));
      toast.addEventListener('mouseleave', () => { if (!toast.contains(document.activeElement)) armToast(); });
      toast.addEventListener('focusout', (e) => { if (!toast.contains(e.relatedTarget) && !toast.matches(':hover')) armToast(); });
    }
    if (S.focusSel) {
      const el = S.focusSel.map((q) => [...root.querySelectorAll(q)].find((x) => x.getClientRects().length > 0)).find(Boolean);
      if (el) el.focus();
      S.focusSel = null;
    }
    const f = S.focus && [...root.querySelectorAll(`[data-focus="${S.focus}"]`)].find((el) => el.getClientRects().length > 0);
    if (f) { f.focus(); if (f.setSelectionRange && f.value) f.setSelectionRange(f.value.length, f.value.length); }
    S.focus = null;
    S.justDone = null;
  }

  function nameError(v, except) {
    const n = v.trim();
    if (!n) return 'Hãy nhập tên danh sách.';
    if (S.lists.some((l) => l.id !== except && l.name.trim().toLocaleLowerCase('vi') === n.toLocaleLowerCase('vi'))) return 'Đã có danh sách tên này.';
    return '';
  }

  root.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const form = ev.target;
    const fd = new FormData(form);
    const kind = form.dataset.form;
    if (kind === 'add') {
      const title = String(fd.get('title') || '').trim();
      const badDue = L >= 4 && form.querySelector('[name=due]')?.validity.badInput;
      if (title && badDue) { S.addError = 'Ngày hạn chót không hợp lệ.'; S.addErrField = 'due'; S.addText = String(fd.get('title')); S.addDraft = { due: '', prio: String(fd.get('prio') || 'med') }; S.focus = 'adddue'; return render(); }
      S.addErrField = 'title';
      if (!title) { S.addText = String(fd.get('title') || ''); S.addError = 'Hãy nhập tên việc.'; S.addDraft = { due: String(fd.get('due') || ''), prio: String(fd.get('prio') || 'med') }; S.focus = 'add'; return render(); }
      S.tasks.push({ id: 't' + seq, seq: seq++, listId: S.current, title, done: false, due: L >= 4 ? fd.get('due') || null : null, prio: L >= 4 ? fd.get('prio') || 'med' : 'med' });
      S.addError = ''; S.addDraft = null; S.addText = ''; S.focus = 'add';
      if (L >= 3 && S.filter === 'done') S.filter = 'all';
    } else if (kind === 'edit') {
      const title = String(fd.get('title') || '').trim();
      S.editErrField = 'title';
      if (!title) { S.editing.title = ''; S.editError = 'Hãy nhập tên việc.'; S.focus = 'edit'; return render(); }
      if (L >= 4 && form.querySelector('[name=due]')?.validity.badInput) { S.editing.due = ''; S.editError = 'Ngày hạn chót không hợp lệ.'; S.editErrField = 'due'; S.focus = 'editdue'; return render(); }
      const t = S.tasks.find((x) => x.id === S.editing.id);
      t.title = title;
      if (L >= 4) { t.due = fd.get('due') || null; t.prio = fd.get('prio') || 'med'; }
      S.focusSel = [`button[data-act="edit"][data-id="${t.id}"]`];
      S.editing = null; S.editError = '';
    } else if (kind === 'newlist') {
      const v = String(fd.get('name') || '');
      const err = nameError(v);
      if (err) { S.newList = { value: v, error: err }; S.focus = 'newlist'; return render(); }
      const id = 'l' + seq++;
      S.lists.push({ id, name: v.trim() });
      S.current = id; S.newList = null; S.menuOpen = false; S.editing = null; S.focus = 'add';
    } else if (kind === 'rename') {
      const v = String(fd.get('name') || '');
      const err = nameError(v, S.current);
      if (err) { S.renaming = { value: v, error: err }; S.focus = 'rename'; return render(); }
      listOf(S.current).name = v.trim(); S.renaming = null; S.focusSel = ['button[data-act="rename"]'];
    }
    render();
  });

  root.addEventListener('input', (ev) => {
    const form = ev.target.form;
    if (form && form.dataset.form === 'edit' && S.editing) { const fd = new FormData(form); S.editing.title = String(fd.get('title') ?? ''); S.editing.due = String(fd.get('due') ?? ''); S.editing.prio = String(fd.get('prio') ?? 'med'); }
    const clearErr = () => { ev.target.removeAttribute('aria-invalid'); form.querySelector('.err')?.remove(); };
    if (form && form.dataset.form === 'edit' && S.editError && ev.target.name === 'title' && ev.target.value.trim()) { S.editError = ''; clearErr(); }
    if (form && form.dataset.form === 'newlist' && S.newList) { S.newList.value = ev.target.value; if (S.newList.error && ev.target.value.trim()) { S.newList.error = ''; clearErr(); } }
    if (form && form.dataset.form === 'rename' && S.renaming) { S.renaming.value = ev.target.value; if (S.renaming.error && ev.target.value.trim()) { S.renaming.error = ''; clearErr(); } }
    if (form && form.dataset.form === 'add') { const fd = new FormData(form); S.addText = String(fd.get('title') ?? ''); if (L >= 4) S.addDraft = { due: String(fd.get('due') ?? ''), prio: String(fd.get('prio') ?? 'med') }; }
    if (form && form.dataset.form === 'add' && S.addError && ev.target.name === 'title' && ev.target.value.trim()) { S.addError = ''; ev.target.removeAttribute('aria-invalid'); form.querySelector('.err')?.remove(); }
  });

  root.addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.dataset.act === 'toggle') {
      const t = S.tasks.find((x) => x.id === el.dataset.id);
      t.done = el.checked;
      if (t.done) S.justDone = t.id;
      if (L >= 3 && S.filter !== 'all') {
        const next = neighbour('.tasks input[data-act="toggle"]', t.id);
        if (!t.done) { S.focusSel = [next ? `input[data-act="toggle"][data-id="${next}"]` : '#add-title', '#add-title']; render(); return; }
        const finish = () => { S.leaving = null; S.focusSel = [next ? `input[data-act="toggle"][data-id="${next}"]` : '#add-title', '#add-title']; render(); };
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) finish();
        else { S.leaving = t.id; S.focusSel = [`input[data-act="toggle"][data-id="${t.id}"]`]; render(); setTimeout(finish, 200); }
      } else { S.focusSel = [`input[data-act="toggle"][data-id="${t.id}"]`]; render(); }
    }
    if (el.form && el.form.dataset.form === 'edit' && S.editing && el.name === 'due') { S.editing.due = el.value; render(); S.focus = null; }
  });

  root.addEventListener('keydown', (ev) => {
    const ef = ev.target.form;
    if (ev.key === 'Enter' && ef && ef.dataset.form === 'edit' && ev.target.tagName !== 'BUTTON' && !ev.isComposing) { ev.preventDefault(); ef.requestSubmit(); return; }
    if (ev.key !== 'Escape') return;
    if (S.confirmDelete) { S.confirmDelete = null; render(); }
    else if (S.newList) { S.newList = null; S.focusSel = ['button[data-act="newlist"]']; render(); }
    else if (S.menuOpen) { S.menuOpen = false; render(); }
    else if (S.editing) { S.focusSel = [`button[data-act="edit"][data-id="${S.editing.id}"]`]; S.editing = null; S.editError = ''; render(); }
    else if (S.renaming) { S.renaming = null; S.focusSel = ['button[data-act="rename"]']; render(); }
  });

  root.addEventListener('click', (ev) => {
    const p = ev.target.closest('[data-p]');
    if (p) {
      if (p.dataset.p === 'go') location.hash = p.dataset.id;
      if (p.dataset.p === 'reset') { clearTimeout(toastTimer); S = fresh(); render(); }
      if (p.dataset.p === 'sample') { clearTimeout(toastTimer); S = withSample(fresh()); render(); }
      return;
    }
    const b = ev.target.closest('[data-act]');
    if (!b || b.dataset.act === 'toggle') return;
    const id = b.dataset.id;
    switch (b.dataset.act) {
      case 'edit': { const t = S.tasks.find((x) => x.id === id); S.editing = { id, title: t.title, due: t.due || '', prio: t.prio }; S.editError = ''; S.focus = 'edit'; break; }
      case 'cancel': S.focusSel = [`button[data-act="edit"][data-id="${S.editing.id}"]`]; S.editing = null; S.editError = ''; break;
      case 'nodue': S.editing.due = ''; S.focus = 'editdue'; break;
      case 'del': { const nx = neighbour('button[data-act="del"]', id); S.focusSel = ev.detail === 0 ? ['.toast button[data-act="undo"]'] : [nx ? `button[data-act="del"][data-id="${nx}"]` : '#add-title', '#add-title']; const i = S.tasks.findIndex((x) => x.id === id); const [t] = S.tasks.splice(i, 1); if (S.editing && S.editing.id === id) S.editing = null; setToast(`Đã xoá “${t.title}”`, [{ t, i }]); break; }
      case 'undo': { clearTimeout(toastTimer); const r = S.toast.restore; [...r].sort((a, b2) => a.i - b2.i).forEach(({ t, i }) => S.tasks.splice(Math.min(i, S.tasks.length), 0, t)); const back = new Set(r.map((x) => x.t.id)); S.focusSel = [...ordered(inList()).filter((t) => back.has(t.id)).map((t) => `input[data-act="toggle"][data-id="${t.id}"]`), '#add-title']; S.toast = null; break; }
      case 'filter': {
        S.filter = id;
        const et = S.editing && S.tasks.find((x) => x.id === S.editing.id);
        if (et && ((id === 'active' && et.done) || (id === 'done' && !et.done))) { S.editing = null; S.editError = ''; }
        break;
      }
      case 'clear': { if (S.editing && S.tasks.find((x) => x.id === S.editing.id)?.done) { S.editing = null; S.editError = ''; } S.focusSel = ['#add-title']; const gone = S.tasks.map((t, i) => ({ t, i })).filter((x) => x.t.done && x.t.listId === S.current); S.tasks = S.tasks.filter((t) => !(t.done && t.listId === S.current)); setToast(`Đã xoá ${gone.length} việc đã xong`, gone); S.toast.clear = true; break; }
      case 'open': S.addText = ''; S.addDraft = null; S.addError = ''; S.current = id; S.editing = null; S.editError = ''; S.renaming = null; S.newList = null; S.menuOpen = false; break;
      case 'newlist': S.newList = { value: '', error: '' }; S.focus = 'newlist'; break;
      case 'nlcancel': S.newList = null; S.focusSel = ['button[data-act="newlist"]']; break;
      case 'rename': S.renaming = { value: listOf(S.current).name, error: '' }; S.focus = 'rename'; break;
      case 'rncancel': S.renaming = null; S.focusSel = ['button[data-act="rename"]']; break;
      case 'dellist': {
        if (S.tasks.some((t) => t.listId === S.current)) { S.confirmDelete = S.current; S.focus = 'dlcancel'; }
        else { const gone = S.current; S.lists = S.lists.filter((l) => l.id !== gone); S.current = S.lists[0].id; dropToastOf(gone); S.focusSel = ['#add-title']; }
        break;
      }
      case 'dlcancel': S.confirmDelete = null; break;
      case 'dlok': { const gone = S.confirmDelete; S.tasks = S.tasks.filter((t) => t.listId !== gone); S.lists = S.lists.filter((l) => l.id !== gone); S.current = S.lists[0].id; S.confirmDelete = null; dropToastOf(gone); S.focusSel = ['#add-title']; break; }
      case 'menu': S.menuOpen = true; S.focus = 'menu'; break;
      case 'menuclose': S.menuOpen = false; break;
      default: return;
    }
    render();
  });

  function route() {
    if (CFG.demo) { if (!current) { current = 'demo'; S = fresh(); render(); } return; }
    const id = location.hash.slice(1);
    const s = CFG.screens.find((x) => x.id === id) || CFG.screens[0];
    current = s.id;
    clearTimeout(toastTimer);
    seq = 100;
    S = PRESETS[s.preset]();
    render();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body></html>
